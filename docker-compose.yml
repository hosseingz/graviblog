# ==============================================================================
# Production Docker Compose Orchestration
# Enforces network isolation, healthchecks, YAML anchors, and log rotation
# ==============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-backend-base: &backend-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  logging: *default-logging
  networks:
    - internal_net
  env_file:
    - .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/1}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/0}
    CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/0}
    INTERNAL_API_BASE_URL: http://backend:8000
    DJANGO_SETTINGS_MODULE: config.settings

services:
  # ----------------------------------------------------------------------------
  # Database: PostgreSQL
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal_net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-django_db}
      POSTGRES_USER: ${POSTGRES_USER:-django_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Cache & Broker: Redis
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal_net
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redispassword}"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Backend API: Django REST Framework (Gunicorn)
  # ----------------------------------------------------------------------------
  backend:
    <<: *backend-base
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/src/static
      - media_volume:/src/media
    expose:
      - "8000"

  # ----------------------------------------------------------------------------
  # Celery Asynchronous Worker (Isolated via 'celery' profile)
  # ----------------------------------------------------------------------------
  celery_worker:
    <<: *backend-base
    profiles: ["celery"]
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=4"]
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - media_volume:/src/media

  # ----------------------------------------------------------------------------
  # Celery Periodic Task Scheduler (Isolated via 'celery' profile)
  # ----------------------------------------------------------------------------
  celery_beat:
    <<: *backend-base
    profiles: ["celery"]
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Frontend: Next.js (App Router SSR Container)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal_net
    environment:
      NODE_ENV: production
      INTERNAL_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    expose:
      - "3000"
    depends_on:
      - backend

  # ----------------------------------------------------------------------------
  # Edge Gateway & Reverse Proxy: Nginx
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal_net
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  internal_net:
    driver: bridge
