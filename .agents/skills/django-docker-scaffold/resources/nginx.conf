# ==============================================================================
# Nginx Reverse Proxy Configuration
# Routes external traffic to Django backend, Next.js frontend, and static volumes
# ==============================================================================

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

# Map for WebSocket connection upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # 1. Django Static Assets
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 2. Django Media Uploads
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 3. Django Admin Interface
    location /admin/ {
        proxy_pass http://backend;
        proxy_redirect off;
    }

    # 4. Django REST Framework APIs & Healthcheck
    location /api/ {
        proxy_pass http://backend;
        proxy_redirect off;
    }

    # 5. Next.js Frontend Application (Default Route)
    location / {
        proxy_pass http://frontend;
        proxy_redirect off;
    }
}
